<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect Kick — SlotBuddy</title>
<style>
:root{color-scheme:dark;--blue:#35d5ff;--pink:#ff39b9}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:radial-gradient(circle at 15% 10%,#173f70,transparent 38%),radial-gradient(circle at 90% 20%,#64205b,transparent 35%),#090d1d;color:#f8f9ff;font-family:system-ui,sans-serif}
main{max-width:520px;width:100%;padding:28px;border:1px solid #3b4b73;border-radius:20px;background:#171e38;text-align:center;box-shadow:0 0 28px #35d5ff22}
h1{color:var(--blue)}p{line-height:1.6;color:#d5def6}a{color:var(--pink);font-weight:800}
</style>
</head>
<body>
<main>
<h1>💗 SlotBuddy + Kick 💙</h1>
<p id="message">Finishing your secure Kick connection…</p>
<p id="back" hidden><a href="./">Return to SlotBuddy tournament page</a></p>
</main>
<script>
(async()=>{
 const message=document.getElementById("message");
 const back=document.getElementById("back");
 const params=new URLSearchParams(location.search);
 const error=params.get("error");
 if(error){message.textContent="Kick did not approve the connection. Please return to SlotBuddy and try again.";back.hidden=false;return;}
 const code=params.get("code"),state=params.get("state");
 if(!code||!state){message.textContent="The Kick connection details are missing. Please start again from SlotBuddy.";back.hidden=false;return;}
 try{
  const response=await fetch("https://xbogfbyysrjttyfvzluh.supabase.co/functions/v1/kick-connect",{
   method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"callback",code,state})
  });
  const result=await response.json();
  if(!response.ok||!result.ok)throw new Error(result.error||"Connection could not be completed.");
  message.textContent="🎉 Kick is connected! SlotBuddy can now prepare chat announcements. Return to your tournament page to send a test message.";
 }catch(e){message.textContent=e.message||"Something went wrong. Please return to SlotBuddy and try again.";}
 back.hidden=false;
})();
</script>
</body>
</html>
