<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournament OBS Overlay</title>
<style>
:root{--blue:#35d5ff;--pink:#ff39b9;--bg:#090d1d;--panel:#171e38;--line:#3b4b73;--white:#f8f9ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent;color:var(--white);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{padding:12px}.shell{width:100%;padding:clamp(12px,2vw,22px);border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1b2544f5,#14182df5);box-shadow:0 0 25px #26cfff1c,0 0 25px #ff39b91c}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.brand{font-weight:950;letter-spacing:.16em;color:var(--pink);font-size:clamp(10px,1.2vw,14px);text-transform:uppercase}.event{font-size:clamp(20px,3vw,34px);font-weight:950;color:var(--blue);margin-top:4px}.state{color:#bac8e8;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.12em}
.rounds{display:flex;gap:14px;align-items:stretch;overflow-x:auto;padding:12px 2px 18px}.round{flex:0 0 220px;min-width:220px;display:flex;flex-direction:column;gap:12px;justify-content:space-around}.round:first-child{justify-content:flex-start}.round h3{font-size:.9rem;color:var(--pink);text-transform:uppercase;letter-spacing:.1em;margin:0 0 3px}.match{background:#0d142b;border:1px solid #3b4d76;border-radius:14px;padding:10px;box-shadow:inset 0 0 14px #35d5ff0c}.match-label{font-size:.7rem;color:#9eaccd;font-weight:800;margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em}.player{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin:4px 0;padding:9px 10px;background:#202b4b;color:#eaf2ff;border:1px solid #465a85;border-radius:9px;font-size:.87rem;font-weight:800;overflow-wrap:anywhere}.player.winner{background:linear-gradient(100deg,#123b54,#4a1c4a);border-color:var(--pink);color:white;box-shadow:0 0 12px #ff39b933}.player.empty{visibility:hidden;background:transparent;border-color:transparent}.player.empty:not(:empty){visibility:visible;background:#202b4b;border-color:#465a85;color:#eaf2ff}.player small{color:var(--blue);font-size:.68rem;font-weight:900}.champion{margin-top:12px;text-align:center;padding:16px;border:1px solid var(--pink);border-radius:16px;background:linear-gradient(100deg,#142744,#401b43);font-size:1.25rem;font-weight:950;box-shadow:0 0 20px #ff39b933}.champion strong{color:var(--pink);display:block;font-size:.75rem;letter-spacing:.16em;margin-bottom:5px}.empty-state{text-align:center;padding:22px 12px;color:#bac8e8;font-weight:800}
</style>
</head>
<body>
<div class="shell">
 <div class="top"><div><div class="brand">👑 CHAOS QUEEN TOURNAMENT</div><div class="event" id="event">Waiting for tournament…</div></div><div class="state" id="status">Connecting</div></div>
 <div class="rounds" id="rounds"></div>
 <div id="champion"></div>
 <div class="empty-state" id="empty">Build a tournament bracket on your main tournament page to show it here.</div>
</div>
<script>
const ENDPOINT="https://xbogfbyysrjttyfvzluh.supabase.co/functions/v1/tournament-join?action=snapshot";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function roundTitle(r,total){if(r===total-1)return"Final";if(r===total-2)return"Semi-finals";return r===0?"Round 1":"Round "+(r+1);}
function playerName(player){if(!player)return "";if(typeof player==="string")return player;const n=player.username??player.name??player.display_name??player.slug??"";return typeof n==="string"?n:"";}
function roundTitle(r,total){if(r===total-1)return"Final";if(r===total-2)return"Semi-finals";return r===0?"Round 1":"Round "+(r+1);}
function playerName(player){if(!player)return"";if(typeof player==="string")return player;const n=player.username??player.name??player.display_name??player.slug??"";return typeof n==="string"?n:"";}
function slotLabels(rounds){
 const labels=new Map();let n=0;
 for(const match of (rounds[0]||[]))for(const player of [match.a,match.b]){
  n++;if(!player)continue;const name=playerName(player),key=name.toLowerCase();
  if(key&&!labels.has(key))labels.set(key,"Player "+n);
 }
 return labels;
}
function labelFor(player,labels){const name=playerName(player);return name?(labels.get(name.toLowerCase())||"Player"):"";}
function draw(data){
 const bracket=data?.bracket;
 if(!bracket?.rounds?.length){document.getElementById("event").textContent="Waiting for tournament…";document.getElementById("rounds").innerHTML="";document.getElementById("champion").innerHTML="";document.getElementById("empty").style.display="block";return;}
 document.getElementById("empty").style.display="none";
 document.getElementById("event").textContent=bracket.name||"Tournament Bracket";
 document.getElementById("status").textContent="LIVE • "+(bracket.count||"")+" PLAYERS";
 const rs=bracket.rounds,labels=slotLabels(rs);
 document.getElementById("rounds").innerHTML=rs.map((matches,r)=>'<section class="round"><h3>'+roundTitle(r,rs.length)+'</h3>'+matches.map((m,i)=>{
  const aName=m.a?labelFor(m.a,labels):(r===0?"Player "+(i*2+1):"");
  const bName=m.b?labelFor(m.b,labels):(r===0?"Player "+(i*2+2):"");
  const aWin=!!m.winner&&playerName(m.winner)===playerName(m.a);
  const bWin=!!m.winner&&playerName(m.winner)===playerName(m.b);
  return '<div class="match"><div class="match-label">Match '+(i+1)+'</div><div class="player '+(aWin?"winner":"")+'">'+esc(aName)+(aWin?' <small>✓ ADVANCES</small>':"")+'</div><div class="player '+(bWin?"winner":"")+'">'+esc(bName)+(bWin?' <small>✓ ADVANCES</small>':"")+'</div></div>';
 }).join("")+'</section>').join("");
 const champ=rs[rs.length-1]?.[0]?.winner;
 document.getElementById("champion").innerHTML=champ?'<div class="champion"><strong>🏆 TOURNAMENT CHAMPION 🏆</strong>'+esc(labelFor(champ,labels))+'</div>':"";
}
async function refresh(){try{const r=await fetch(ENDPOINT,{cache:"no-store"});if(!r.ok)throw new Error();const data=await r.json();draw(data);document.getElementById("status").textContent="LIVE • UPDATED";}catch(e){document.getElementById("status").textContent="RECONNECTING";}}
refresh();setInterval(refresh,4000);
</script>
</body>
</html>
