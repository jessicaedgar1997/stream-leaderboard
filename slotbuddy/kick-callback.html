<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1023">
<title>Kick Sign-In | SlotBuddy</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#173f70,transparent 38%),radial-gradient(circle at 90% 20%,#64205b,transparent 35%),#090d1d;color:#f8f9ff;font-family:system-ui,sans-serif}
main{max-width:520px;width:100%;padding:30px;border:1px solid #3b4b73;border-radius:20px;background:#171e38;text-align:center;box-shadow:0 0 28px #35d5ff22}
h1{color:#35d5ff}p{line-height:1.6;color:#d5def6}.btn{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:999px;background:linear-gradient(90deg,#35d5ff,#fff,#ff39b9);color:#090d1d;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<main>
<h1>💗 SlotBuddy + Kick 💙</h1>
<p id="message">Finishing your secure Kick sign-in…</p>
<a class="btn" id="back" href="./" hidden>Return to SlotBuddy</a>
</main>
<script>
(async () => {
  const message = document.getElementById("message");
  const back = document.getElementById("back");
  const params = new URLSearchParams(location.search);
  const error = params.get("error");
  const code = params.get("code");
  const state = params.get("state");
  history.replaceState({}, document.title, location.pathname);
  if (error) {
    message.textContent = "Kick sign-in was not approved. Please return to SlotBuddy and try again.";
    back.hidden = false;
    return;
  }
  if (!code || !state) {
    message.textContent = "The Kick sign-in details are missing. Please start again from SlotBuddy.";
    back.hidden = false;
    return;
  }
  try {
    const response = await fetch("https://xbogfbyysrjttyfvzluh.supabase.co/functions/v1/slotbuddy-kick-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "callback", code, state })
    });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || "Kick sign-in could not be completed.");
    sessionStorage.setItem("slotbuddy_kick_access_token", result.access_token);
    sessionStorage.setItem("slotbuddy_kick_user_id", result.user.id);
    sessionStorage.setItem("slotbuddy_kick_username", result.user.username);
    message.textContent = "You're signed in as @" + result.user.username + "! Taking you back to SlotBuddy…";
    back.hidden = false;
    setTimeout(() => location.replace("./"), 1600);
  } catch (error) {
    message.textContent = error.message || "Something went wrong. Please return to SlotBuddy and try again.";
    back.hidden = false;
  }
})();
</script>
</body>
</html>
