<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1023">
<title>Sign in with Kick | SlotBuddy</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at 15% 10%,#173f70 0,transparent 38%),radial-gradient(circle at 90% 15%,#64205b 0,transparent 34%),#090d1d;color:#f8f9ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.top{width:min(100%,900px);margin:0 auto 22px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}.navlinks{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.navlinks a{color:#eaf2ff;text-decoration:none;border:1px solid #52628c;border-radius:99px;padding:8px 12px;font-size:.82rem;font-weight:850}.login{width:min(100%,440px);margin:8vh auto 0;padding:32px 24px;text-align:center;border:1px solid #52628c;border-radius:22px;background:linear-gradient(145deg,#1b2545f2,#121a33f2);box-shadow:0 0 36px #35d5ff22}
.brand{font-size:1.1rem;font-weight:950;letter-spacing:.06em;color:#fff;text-decoration:none;margin-bottom:0}
h1{font-size:1.8rem;margin:0 0 10px}
p{color:#b7c2df;line-height:1.55;margin:0 0 20px}
.btn{border:0;border-radius:999px;padding:14px 25px;font-size:1rem;font-weight:900;cursor:pointer;color:#090d1d;background:linear-gradient(90deg,#35d5ff,#fff,#ff39b9);box-shadow:0 0 22px #35d5ff33}
.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:24px;margin:16px 0 0;font-size:.9rem}
.signed{color:#a7f3d0;font-weight:800}.dashboard-link{display:inline-block;margin-top:14px;color:#35d5ff;font-weight:850;text-decoration:none;border:1px solid #52628c;border-radius:99px;padding:9px 14px}.dashboard-link[hidden]{display:none}

/* Jessica's site-wide button theme */
button,.btn,input[type="button"],input[type="submit"]{
  background:linear-gradient(100deg,#ff39b9 0%,#65dfff 100%)!important;
  color:#100d20!important;border:1px solid rgba(255,255,255,.22)!important;
  font-weight:900;box-shadow:0 5px 18px rgba(255,57,185,.16),0 5px 18px rgba(101,223,255,.14);
  transition:filter .16s ease,transform .16s ease,box-shadow .16s ease;
}
button:hover:not(:disabled),.btn:hover,input[type="button"]:hover:not(:disabled),input[type="submit"]:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
button:disabled,input[type="button"]:disabled,input[type="submit"]:disabled{opacity:.48!important;cursor:not-allowed}
button.is-on,.btn.is-on{background:#ff39b9!important;color:#fff!important;border-color:#ff8bd6!important;box-shadow:0 0 18px #ff39b966!important}
button.is-off,.btn.is-off{background:#65dfff!important;color:#081526!important;border-color:#a6efff!important;box-shadow:0 0 18px #65dfff55!important}
#openEntries,#openRound{background:#ff39b9!important;color:#fff!important}
#closeEntries,#closeRound{background:#65dfff!important;color:#081526!important}

</style>
</head>
<body>
<main class="login" id="login" aria-label="Kick sign in">
<header class="top"><a class="brand" href="https://jessicaedgar1997.github.io/stream-leaderboard/">👑 JESSICAEDGAR1997</a><nav class="navlinks" aria-label="Site navigation"><a href="./#login">Sign in with Kick</a><a href="https://jessicaedgar1997.github.io/stream-leaderboard/">Home</a><a href="https://jessicaedgar1997.github.io/stream-leaderboard/leaderboard/">Leaderboard</a><a href="https://jessicaedgar1997.github.io/stream-leaderboard/slotbuddy/bonus-hunt.html">Bonus Hunt</a><a href="https://jessicaedgar1997.github.io/stream-leaderboard/slotbuddy/giveaway.html">Keyword Giveaway</a><a href="https://jessicaedgar1997.github.io/stream-leaderboard/tournament/">Tournament</a><a href="https://jessicaedgar1997.github.io/stream-leaderboard/cozies/">Cozies</a><a id="nameWheelNav" href="./name-wheel.html" hidden>Name Wheel</a></nav></header>
<h1>Sign in with Kick</h1>
<p>Use your Kick account to sign in.</p>
<button class="btn" id="kickLogin" type="button">Sign in with Kick</button>
<p class="msg" id="loginMessage" role="status" aria-live="polite">You are not signed in.</p>
<a class="dashboard-link" id="dashboardLink" href="./dashboard.html" hidden>🛠️ Open Organizer Dashboard</a>
</main>
<script>
const LOGIN_URL = "https://xbogfbyysrjttyfvzluh.supabase.co/functions/v1/slotbuddy-kick-login";
const button = document.getElementById("kickLogin");
const message = document.getElementById("loginMessage");
const dashboardLink = document.getElementById("dashboardLink");
const SESSION_KEY = "slotbuddy_kick_session";
let signedIn = false;
function showSignedIn(user) {
  signedIn = true;
  dashboardLink.hidden = user.role !== "owner";
  const wheelLink = document.getElementById("nameWheelNav"); if (wheelLink) wheelLink.hidden = !(user.role === "owner" || user.role === "moderator");
  message.textContent = "You're signed in as @" + user.username + ". You'll stay signed in on this browser until you choose to sign out.";
  message.className = "msg signed";
  button.textContent = "Sign out";
  button.disabled = false;
}
async function resumeSavedLogin() {
  const sessionKey = localStorage.getItem(SESSION_KEY);
  if (!sessionKey) return;
  button.disabled = true;
  message.textContent = "Restoring your Kick sign-in…";
  try {
    const response = await fetch(LOGIN_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "resume", session_key: sessionKey })
    });
    const data = await response.json();
    if (!response.ok || !data.ok || !data.user) throw new Error(data.error || "Please sign in again.");
    showSignedIn(data.user);
  } catch (error) {
    localStorage.removeItem(SESSION_KEY);
    signedIn = false;
    dashboardLink.hidden = true;
    message.textContent = "Your saved sign-in needs to be renewed. Please sign in with Kick again.";
    message.className = "msg";
    button.textContent = "Sign in with Kick";
    button.disabled = false;
  }
}
button.addEventListener("click", async () => {
  button.disabled = true;
  try {
    if (signedIn) {
      message.textContent = "Signing you out…";
      const sessionKey = localStorage.getItem(SESSION_KEY);
      await fetch(LOGIN_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "logout", session_key: sessionKey })
      });
      localStorage.removeItem(SESSION_KEY);
      signedIn = false;
      dashboardLink.hidden = true;
      message.textContent = "You've signed out. Sign in with Kick whenever you're ready.";
      message.className = "msg";
      button.textContent = "Sign in with Kick";
      button.disabled = false;
      return;
    }
    message.className = "msg";
    message.textContent = "Opening Kick securely…";
    const response = await fetch(LOGIN_URL + "?action=start");
    const data = await response.json();
    if (!response.ok || !data.authorize_url) throw new Error(data.error || "Kick sign-in is not ready yet.");
    location.href = data.authorize_url;
  } catch (error) {
    message.textContent = error.message || "Could not complete that action. Please try again.";
    button.disabled = false;
  }
});
resumeSavedLogin();
</script>

<script>
(()=>{const paint=()=>{document.querySelectorAll('button,.btn,input[type="button"],input[type="submit"]').forEach(b=>{const t=(b.textContent||b.value||"").trim().toUpperCase();b.classList.remove("is-on","is-off");if(/\bON\s*$/.test(t)||b.id==="openEntries"||b.id==="openRound")b.classList.add("is-on");else if(/\bOFF\s*$/.test(t)||b.id==="closeEntries"||b.id==="closeRound")b.classList.add("is-off");});};paint();new MutationObserver(paint).observe(document.documentElement,{subtree:true,childList:true,characterData:true});})();
</script>

</body>
</html>
