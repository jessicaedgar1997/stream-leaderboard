<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1023">
<title>Sign in with Kick | SlotBuddy</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at 15% 10%,#173f70 0,transparent 38%),radial-gradient(circle at 90% 15%,#64205b 0,transparent 34%),#090d1d;color:#f8f9ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.top{width:min(100%,900px);margin:0 auto 22px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}.navlinks{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.navlinks a{color:#eaf2ff;text-decoration:none;border:1px solid #52628c;border-radius:99px;padding:8px 12px;font-size:.82rem;font-weight:850}.login{width:min(100%,440px);margin:8vh auto 0;padding:32px 24px;text-align:center;border:1px solid #52628c;border-radius:22px;background:linear-gradient(145deg,#1b2545f2,#121a33f2);box-shadow:0 0 36px #35d5ff22}
.brand{font-size:1.1rem;font-weight:950;letter-spacing:.06em;margin-bottom:26px}
.brand span{color:#35d5ff}
h1{font-size:1.8rem;margin:0 0 10px}
p{color:#b7c2df;line-height:1.55;margin:0 0 20px}
.btn{border:0;border-radius:999px;padding:14px 25px;font-size:1rem;font-weight:900;cursor:pointer;color:#090d1d;background:linear-gradient(90deg,#35d5ff,#fff,#ff39b9);box-shadow:0 0 22px #35d5ff33}
.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:24px;margin:16px 0 0;font-size:.9rem}
.signed{color:#a7f3d0;font-weight:800}
</style>
</head>
<body>
<main class="login" id="login" aria-label="Kick sign in">
<header class="top"><div class="brand">⚡ SLOT<span>BUDDY</span></div><nav class="navlinks" aria-label="Site navigation"><a href="../">Home</a><a href="./">Slot Calls</a><a href="./bonus-hunt.html">🎰 Bonus Hunt</a><a href="../cozies/">💗 Cozies Tracker</a></nav></header>
<h1>Sign in with Kick</h1>
<p>Use your Kick account to sign in.</p>
<button class="btn" id="kickLogin" type="button">Sign in with Kick</button>
<p class="msg" id="loginMessage" role="status" aria-live="polite">You are not signed in.</p>
</main>
<script>
const LOGIN_URL = "https://xbogfbyysrjttyfvzluh.supabase.co/functions/v1/slotbuddy-kick-login";
const button = document.getElementById("kickLogin");
const message = document.getElementById("loginMessage");
const SESSION_KEY = "slotbuddy_kick_session";
let signedIn = false;
function showSignedIn(user) {
  signedIn = true;
  message.textContent = "You're signed in as @" + user.username + ". You'll stay signed in on this browser until you choose to sign out.";
  message.className = "msg signed";
  button.textContent = "Sign out";
  button.disabled = false;
}
async function resumeSavedLogin() {
  const sessionKey = localStorage.getItem(SESSION_KEY);
  if (!sessionKey) return;
  button.disabled = true;
  message.textContent = "Restoring your Kick sign-in…";
  try {
    const response = await fetch(LOGIN_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "resume", session_key: sessionKey })
    });
    const data = await response.json();
    if (!response.ok || !data.ok || !data.user) throw new Error(data.error || "Please sign in again.");
    showSignedIn(data.user);
  } catch (error) {
    localStorage.removeItem(SESSION_KEY);
    signedIn = false;
    message.textContent = "Your saved sign-in needs to be renewed. Please sign in with Kick again.";
    message.className = "msg";
    button.textContent = "Sign in with Kick";
    button.disabled = false;
  }
}
button.addEventListener("click", async () => {
  button.disabled = true;
  try {
    if (signedIn) {
      message.textContent = "Signing you out…";
      const sessionKey = localStorage.getItem(SESSION_KEY);
      await fetch(LOGIN_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "logout", session_key: sessionKey })
      });
      localStorage.removeItem(SESSION_KEY);
      signedIn = false;
      message.textContent = "You've signed out. Sign in with Kick whenever you're ready.";
      message.className = "msg";
      button.textContent = "Sign in with Kick";
      button.disabled = false;
      return;
    }
    message.className = "msg";
    message.textContent = "Opening Kick securely…";
    const response = await fetch(LOGIN_URL + "?action=start");
    const data = await response.json();
    if (!response.ok || !data.authorize_url) throw new Error(data.error || "Kick sign-in is not ready yet.");
    location.href = data.authorize_url;
  } catch (error) {
    message.textContent = error.message || "Could not complete that action. Please try again.";
    button.disabled = false;
  }
});
resumeSavedLogin();
</script>
</body>
</html>
