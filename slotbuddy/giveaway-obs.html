<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SlotBuddy Giveaway OBS</title>
<style>
:root{--pink:#ff39b9;--blue:#35d5ff;--gold:#ffd76a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,Segoe UI,sans-serif;color:#fff}
#stage{width:100%;height:100%;padding:12px;display:flex;align-items:center;justify-content:center}
.panel{width:100%;height:100%;max-height:430px;padding:20px 24px;border:2px solid var(--blue);border-radius:24px;background:linear-gradient(135deg,rgba(17,20,48,.96),rgba(48,18,66,.95));box-shadow:0 0 24px #35d5ff88,0 0 48px #ff39b955,inset 0 0 30px #35d5ff18;position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;inset:-80%;pointer-events:none;background:conic-gradient(from 0deg,transparent,rgba(53,213,255,.10),transparent,rgba(255,57,185,.12),transparent);animation:orbit 12s linear infinite}
.inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:12px}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #52628c;padding-bottom:10px}
.brand{font-size:26px;font-weight:1000;letter-spacing:.08em;color:var(--blue);text-shadow:0 0 14px #35d5ff77}
.status{font-size:16px;font-weight:900;color:var(--gold);text-align:right}
.main{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;min-height:0;flex:1}
.entries-wrap,.winner-wrap{border:1px solid #52628c;border-radius:16px;background:#090f25bb;padding:14px;min-height:0}
.entries-wrap{display:flex;flex-direction:column}
.entries-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.heading{font-size:18px;font-weight:1000;color:var(--blue);letter-spacing:.06em}
.count{font-size:15px;font-weight:900;color:#fff;background:#ff39b933;border:1px solid #ff39b988;border-radius:99px;padding:5px 10px}
#entryList{width:100%;flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;white-space:normal;position:relative;mask-image:linear-gradient(180deg,transparent,#000 5%,#000 95%,transparent)}
.ticker-track{display:flex;flex-direction:column;align-items:stretch;gap:10px;width:100%;flex:0 0 auto;animation:ticker-scroll-down var(--ticker-duration,28s) linear infinite}
.ticker-group{display:flex;flex-direction:column;align-items:stretch;gap:10px;flex:0 0 auto}
.entry{display:flex;align-items:center;justify-content:center;width:100%;font-size:18px;font-weight:900;padding:8px 12px;border-radius:12px;background:#1b2545;border:1px solid #35d5ff88;white-space:nowrap;box-shadow:0 0 10px #35d5ff22}
.empty{font-size:17px;color:#b7c2df;padding:12px 4px;white-space:normal;text-align:center}
@keyframes ticker-scroll-down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.winner-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.winner-label{font-size:17px;font-weight:1000;letter-spacing:.14em;color:var(--blue)}
.winner-name{font-size:clamp(30px,4.3vw,56px);line-height:1.08;font-weight:1000;color:#fff;margin:14px 0;text-shadow:0 0 14px var(--pink),0 0 28px #ff39b988;overflow-wrap:anywhere}
.winner-sub{font-size:17px;font-weight:800;color:#dce7ff}
.timer{font-size:40px;font-weight:1000;color:var(--gold);margin-top:10px;text-shadow:0 0 16px #ffd76a88}
#rollText{display:none;font-size:30px;font-weight:1000;color:#fff;text-shadow:0 0 18px var(--pink);margin:10px 0;overflow-wrap:anywhere}
.winner-wrap.rolling #rollText{display:block}
.winner-wrap.rolling #winnerInfo{display:none}
.winner-wrap.rolling .winner-label{color:var(--pink)}
.footer{font-size:12px;color:#aab8d8;text-align:right}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(max-width:700px){#stage{padding:5px}.panel{padding:12px;border-radius:16px}.brand{font-size:18px}.status{font-size:12px}.main{grid-template-columns:1fr .9fr;gap:8px}.entries-wrap,.winner-wrap{padding:8px}.heading{font-size:13px}.count{font-size:11px;padding:4px 7px}.ticker-track,.ticker-group{gap:7px}.entry{font-size:12px;padding:7px 10px}.winner-label{font-size:12px}.winner-name{font-size:clamp(20px,5vw,34px);margin:8px 0}.winner-sub{font-size:12px}.timer{font-size:27px}#rollText{font-size:20px}}
</style>
</head>
<body>
<div id="stage">
 <div class="panel"><div class="inner">
  <div class="header"><div class="brand">🎁 GIVEAWAY</div><div class="status" id="status">WAITING FOR GIVEAWAY</div></div>
  <div class="main">
   <section class="entries-wrap">
    <div class="entries-head"><div class="heading">👥 ENTRANTS</div><div class="count" id="count">0 ENTERED</div></div>
    <div id="entryList"><div class="empty">Waiting for entries…</div></div>
   </section>
   <section class="winner-wrap" id="winnerWrap">
    <div class="winner-label" id="winnerLabel">GOOD LUCK EVERYONE!</div>
    <div id="rollText">Names are rolling…</div>
    <div id="winnerInfo"><div class="winner-name" id="winnerName">🏆</div><div class="winner-sub" id="winnerSub">The winner will appear here.</div><div class="timer" id="timer"></div></div>
   </section>
  </div>
  <div class="footer" id="keyword">SlotBuddy · Live giveaway</div>
 </div></div>
</div>
<script>
const API="https://xbogfbyysrjttyfvzluh.supabase.co/functions/v1/slotbuddy-giveaway";
const $=id=>document.getElementById(id);
let lastRollId=null, rolling=false, latestSnapshot=null, rollNames=[], rollStarted=0;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function readSnapshot(){
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"obs_snapshot"})});
 if(!r.ok)throw new Error("Snapshot unavailable");
 return await r.json();
}
function renderEntries(data){
 const entries=data.entries||[];
 $("count").textContent=entries.length+" ENTERED";
 const viewport=$("entryList");
 const signature=entries.map(entry=>entry.username+(entry.is_subscriber?"💎":"")).join("|");
 if(viewport.dataset.signature===signature)return;
 viewport.dataset.signature=signature;
 viewport.innerHTML="";
 if(!entries.length){
  const empty=document.createElement("div");empty.className="empty";
  empty.textContent=data.giveaway?"Waiting for entries…":"No giveaway running.";
  viewport.appendChild(empty);return;
 }
 const track=document.createElement("div");track.className="ticker-track";
 const makeGroup=()=>{
  const group=document.createElement("div");group.className="ticker-group";
  for(const entry of entries){
   const item=document.createElement("div");item.className="entry";
   item.textContent="@"+entry.username+(entry.is_subscriber?" 💎":"");
   group.appendChild(item);
  }
  return group;
 };
 track.appendChild(makeGroup());
 track.appendChild(makeGroup());
 track.style.setProperty("--ticker-duration",Math.max(14,entries.length*3.2)+"s");
 viewport.appendChild(track);
}
function renderStatus(data){
 const g=data.giveaway;
 if(!g){$("status").textContent="WAITING FOR GIVEAWAY";$("keyword").textContent="SlotBuddy · Live giveaway";return;}
 $("status").textContent=g.status==="active"?(g.entries_open===false?"ENTRIES PAUSED":"ENTRIES OPEN"):g.status==="closed"?"ENTRIES CLOSED":"GIVEAWAY COMPLETE";
 $("keyword").textContent="TYPE "+String(g.keyword||"").toUpperCase()+" IN CHAT TO ENTER";
}
async function animateRoll(roll){
 if(rolling||!roll?.id||!Array.isArray(roll.names)||!roll.names.length)return;
 rolling=true;lastRollId=roll.id;rollNames=roll.names;
 rollStarted=Date.parse(roll.started_at)||Date.now();
 const duration=Number(roll.duration_ms)||5200;
 $("winnerWrap").classList.add("rolling");
 $("winnerLabel").textContent="🎰 DRAWING A WINNER";
 const end=rollStarted+duration;
 let i=0;
 while(Date.now()<end){
  $("rollText").textContent="@"+rollNames[i%rollNames.length];
  i++;
  await wait(Math.min(360,85+Math.floor((Date.now()-rollStarted)/20)));
 }
 $("winnerWrap").classList.remove("rolling");
 rolling=false;
 renderWinner(latestSnapshot||{});
}
function renderWinner(data){
 const winners=data.winners||[];
 const winner=winners.length?winners[winners.length-1]:null;
 if(!winner){
  $("winnerLabel").textContent="GOOD LUCK EVERYONE!";
  $("winnerName").textContent="🏆";
  $("winnerSub").textContent="The winner will appear here.";
  $("timer").textContent="";
  return;
 }
 $("winnerLabel").textContent="🏆 WINNER #"+(winner.winner_number||winners.length);
 $("winnerName").textContent="@"+winner.username;
 if(winner.claim_status==="pending"&&winner.claim_deadline){
  const seconds=Math.max(0,Math.ceil((new Date(winner.claim_deadline).getTime()-Date.now())/1000));
  $("winnerSub").textContent="Type anything in Kick chat to claim!";
  $("timer").textContent=seconds+"s";
  if(seconds===0)$("winnerSub").textContent="Claim time is up — waiting for the reroll.";
 }else if(winner.claim_status==="claimed"){
  $("winnerSub").textContent="WIN CLAIMED! 🎉";
  $("timer").textContent="✓";
 }else if(winner.claim_status==="expired"){
  $("winnerSub").textContent="Claim time expired.";
  $("timer").textContent="0s";
 }else{
  $("winnerSub").textContent="Winner selected!";
  $("timer").textContent="";
 }
}
async function poll(){
 try{
  const data=await readSnapshot();latestSnapshot=data;
  renderEntries(data);renderStatus(data);
  if(data.roll?.id&&data.roll.id!==lastRollId&&!rolling)animateRoll(data.roll);
  if(!rolling)renderWinner(data);
 }catch(e){$("status").textContent="RECONNECTING…";}
}
poll();
setInterval(poll,1000);
setInterval(()=>{if(latestSnapshot&&!rolling)renderWinner(latestSnapshot);},250);
</script>
</body>
</html>
