<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SlotBuddy Name Wheels OBS</title>
<style>
:root{--pink:#ff39b9;--blue:#65dfff;--white:#fff;--muted:#dce8ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif;color:var(--white)}
.stage{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;padding:12px}
.wheel-card{min-width:0;text-align:center}
.heading{font-weight:1000;letter-spacing:.12em;font-size:clamp(18px,2.2vw,30px);margin:0 0 6px;text-shadow:0 2px 8px #000,0 0 14px #ff39b988}
.heading span{color:var(--blue)}
.wheel-wrap{position:relative;width:min(100%,min(44vw,calc(100vh - 100px)));aspect-ratio:1;margin:auto}
canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 8px 18px #0009)}
.pointer{position:absolute;z-index:2;left:50%;top:-3px;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:0;border-bottom:34px solid white;filter:drop-shadow(0 3px 5px #000)}
.winner{min-height:34px;margin-top:7px;font-weight:1000;font-size:clamp(17px,2vw,27px);color:var(--pink);text-shadow:0 2px 8px #000,0 0 12px #000}
#status{position:fixed;bottom:5px;left:10px;font-size:11px;color:#dce8ff;text-shadow:0 1px 4px #000;opacity:.65}
@media(max-width:600px){.stage{gap:8px;padding:5px}.heading{font-size:15px}.wheel-wrap{width:min(48vw,calc(100vh - 65px))}.pointer{border-left-width:10px;border-right-width:10px;border-bottom-width:22px}.winner{font-size:14px}}
</style>
</head>
<body>
<main class="stage">
<section class="wheel-card"><h2 class="heading">WHEEL <span>1</span> · NAMES</h2><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel1" width="900" height="900"></canvas></div><div class="winner" id="winner1">Ready!</div></section>
<section class="wheel-card"><h2 class="heading">WHEEL <span>2</span> · GAMES</h2><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel2" width="900" height="900"></canvas></div><div class="winner" id="winner2">Ready!</div></section>
</main>
<div id="status">Connecting to SlotBuddy…</div>
<script>
const API="https://xbogfbyysrjttyfvzluh.supabase.co/functions/v1/slotbuddy-name-wheels";
const state={1:{items:[],rotation:0,spinId:null,animating:false},2:{items:[],rotation:0,spinId:null,animating:false}};
const $=id=>document.getElementById(id);
function wheelColor(i,n,id){const t=n<=1?0.5:i/(n-1),from=id===1?[255,57,185]:[101,223,255],to=id===1?[101,223,255]:[255,57,185],rgb=from.map((v,k)=>Math.round(v+(to[k]-v)*t));return "rgb("+rgb.join(",")+")";}
function draw(id){const s=state[id],c=$("wheel"+id),ctx=c.getContext("2d"),items=s.items,n=Math.max(items.length,1),slice=Math.PI*2/n;ctx.clearRect(0,0,900,900);ctx.save();ctx.translate(450,450);ctx.rotate(s.rotation);for(let i=0;i<n;i++){const start=-Math.PI/2+i*slice;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,420,start,start+slice);ctx.closePath();ctx.fillStyle=items.length?wheelColor(i,n,id):"#34466f";ctx.fill();ctx.lineWidth=5;ctx.strokeStyle="#fff";ctx.stroke();if(items.length){ctx.save();ctx.rotate(start+slice/2);ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillStyle="#101126";ctx.font="bold "+Math.max(17,Math.min(30,340/n))+"px system-ui";let name=items[i];if(name.length>22)name=name.slice(0,20)+"…";ctx.fillText(name,385,0,310);ctx.restore();}}ctx.beginPath();ctx.arc(0,0,62,0,Math.PI*2);ctx.fillStyle="#101126";ctx.fill();ctx.lineWidth=8;ctx.strokeStyle="#fff";ctx.stroke();ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold 26px system-ui";ctx.fillText("SPIN",0,0);ctx.restore();}
function animate(id,spin){const s=state[id];if(!s.items.length||!spin.winner)return;const target=((Number(spin.target_rotation)%(Math.PI*2))+Math.PI*2)%(Math.PI*2),start=s.rotation%(Math.PI*2),delta=(target-start+Math.PI*2)%(Math.PI*2)+Math.PI*2*7,begin=performance.now(),duration=5600;s.animating=true;function frame(now){const t=Math.min(1,(now-begin)/duration),ease=1-Math.pow(1-t,5);s.rotation=start+delta*ease;draw(id);if(t<1)requestAnimationFrame(frame);else{s.rotation=target;draw(id);s.animating=false;$("winner"+id).textContent="🎉 "+spin.winner+" 🎉";}}requestAnimationFrame(frame);}
async function refresh(){try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"widget-snapshot"})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Unable to load wheels");for(const w of d.wheels||[]){const id=Number(w.wheel_id),s=state[id];if(!s)continue;const next=Array.isArray(w.entries)?w.entries:[];if(JSON.stringify(next)!==JSON.stringify(s.items)){s.items=next;if(!s.animating)draw(id);}}for(const spin of d.spins||[]){const id=Number(spin.wheel_id),s=state[id];if(!s)continue;if(s.spinId===null){s.spinId=spin.spin_id;draw(id);}else if(s.spinId!==spin.spin_id){s.spinId=spin.spin_id;animate(id,spin);}}$("status").textContent="LIVE · "+new Date().toLocaleTimeString();}catch(e){$("status").textContent="Waiting for wheel data…";}}
draw(1);draw(2);refresh();setInterval(refresh,900);
</script>
</body>
</html>
