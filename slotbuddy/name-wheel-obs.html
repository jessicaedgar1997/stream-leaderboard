<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SlotBuddy Name Wheels OBS</title>
<style>
:root{--pink:#ff39b9;--blue:#65dfff;--white:#fff;--muted:#dce8ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif;color:var(--white)}
/* Full animated autumn forest backdrop, with wheels layered clearly above it. */
.autumn-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#11182c 0%,#3b2634 48%,#713d2b 100%)}
.autumn-bg:before{content:"";position:absolute;width:55vw;height:55vw;max-width:680px;max-height:680px;min-width:300px;min-height:300px;left:50%;top:34%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffd58a 0%,#f5a34c 22%,#cf673c 44%,#8a3c35 63%,transparent 72%);filter:blur(2px);opacity:.72;animation:autumnSun 12s ease-in-out infinite alternate}
.autumn-bg:after{content:"";position:absolute;inset:36% -5% 0;background:linear-gradient(180deg,transparent 0%,#241d29aa 40%,#171b27 100%),radial-gradient(ellipse at 15% 90%,#452a24 0 24%,transparent 25%),radial-gradient(ellipse at 78% 100%,#39251f 0 30%,transparent 31%),linear-gradient(164deg,transparent 0 48%,#332326 49% 62%,transparent 63%),linear-gradient(195deg,transparent 0 51%,#4a2c25 52% 68%,transparent 69%);animation:autumnHills 18s ease-in-out infinite alternate}
.autumn-glow{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(110deg,#f7a34c0a,#ffcf7a18 48%,#c34b2c12);animation:autumnGlow 9s ease-in-out infinite alternate}
@keyframes autumnSun{from{transform:translate(-50%,-47%) scale(.96);opacity:.58}to{transform:translate(-50%,-53%) scale(1.06);opacity:.82}}
@keyframes autumnHills{from{transform:translateX(-1.5%)}to{transform:translateX(1.5%)}}
@keyframes autumnGlow{from{opacity:.35}to{opacity:.9}}
.fall-leaves{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none;contain:strict}
.stage{position:relative;z-index:3}
#status{z-index:4}
.fall-leaf{display:block;position:absolute;top:-14vh;left:var(--x);font-size:var(--size);line-height:1;opacity:0;color:#e99a42;filter:drop-shadow(0 3px 5px #160d08cc);animation:autumnFall var(--duration) ease-in-out var(--delay) infinite;will-change:transform; transform-origin:center}
.fall-leaf:nth-child(3n){color:#bd4c24}.fall-leaf:nth-child(3n+1){color:#e6b34b}.fall-leaf:nth-child(3n+2){color:#a84b25}
@keyframes autumnFall{0%{opacity:0;transform:translate3d(0,-12vh,0) rotate(0deg) scale(.75)}8%{opacity:.95}22%{transform:translate3d(var(--drift1),18vh,0) rotate(155deg) scale(1)}43%{transform:translate3d(var(--drift2),42vh,0) rotate(390deg) scale(.9)}65%{transform:translate3d(var(--drift3),67vh,0) rotate(590deg) scale(1.08)}84%{opacity:.9;transform:translate3d(var(--drift4),91vh,0) rotate(810deg) scale(.92)}100%{opacity:0;transform:translate3d(var(--drift5),116vh,0) rotate(1080deg) scale(.72)}}
@media(prefers-reduced-motion:reduce){.fall-leaf{animation-duration:45s;}}

.stage{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;padding:12px}
.wheel-card{min-width:0;text-align:center}
.heading{font-weight:1000;letter-spacing:.12em;font-size:clamp(18px,2.2vw,30px);margin:0 0 6px;text-shadow:0 2px 8px #000,0 0 14px #ff39b988}
.heading span{color:var(--blue)}
.wheel-wrap{position:relative;width:min(100%,min(44vw,calc(100vh - 100px)));aspect-ratio:1;margin:auto}
canvas{display:block;width:100%;height:100%;animation:wheelGlow 2.8s ease-in-out infinite}@keyframes wheelGlow{0%,100%{filter:drop-shadow(0 8px 15px #ff39b977) drop-shadow(0 8px 18px #0009)}50%{filter:drop-shadow(0 8px 24px #65dfffcc) drop-shadow(0 8px 18px #0009)}}
.pointer{position:absolute;z-index:2;left:50%;top:-3px;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #000;border-bottom:0;filter:drop-shadow(0 3px 5px #000)}
.winner{min-height:34px;margin-top:7px;font-weight:1000;font-size:clamp(17px,2vw,27px);color:var(--pink);text-shadow:0 2px 8px #000,0 0 12px #000}
.winner-pop{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:#050817d9;backdrop-filter:blur(8px)}.winner-pop.show{display:flex;animation:popIn .25s ease-out}.winner-pop-box{width:min(90vw,620px);padding:30px 24px;border:3px solid var(--blue);border-radius:26px;text-align:center;background:linear-gradient(145deg,#28204b,#101a35);box-shadow:0 0 40px #65dfff88,0 0 42px #ff39b977}.winner-pop-title{font-size:clamp(20px,3vw,30px);font-weight:1000;letter-spacing:.1em;color:var(--blue)}.winner-pop-name{white-space:pre-line;font-size:clamp(34px,6vw,66px);line-height:1.2;font-weight:1000;color:#fff;margin:20px 0;overflow-wrap:anywhere;text-shadow:0 0 16px var(--pink),0 0 30px #ff39b9aa}.winner-pop-wheel{font-size:clamp(16px,2vw,23px);font-weight:900;color:#dce7ff}@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
#status{position:fixed;bottom:5px;left:10px;font-size:11px;color:#dce8ff;text-shadow:0 1px 4px #000;opacity:.65}
@media(max-width:600px){.stage{gap:8px;padding:5px}.heading{font-size:15px}.wheel-wrap{width:min(48vw,calc(100vh - 65px))}.pointer{border-left-width:10px;border-right-width:10px;border-bottom-width:22px}.winner{font-size:14px}}
</style>
</head>
<body>
<div class="autumn-bg" aria-hidden="true"></div><div class="autumn-glow" aria-hidden="true"></div>
<div class="fall-leaves" id="fallLeaves" aria-hidden="true"></div>
<div class="winner-pop" id="winnerPop"><div class="winner-pop-box"><div class="winner-pop-title">🎉 WINNER! 🎉</div><div class="winner-pop-name" id="winnerPopName"></div><div class="winner-pop-wheel" id="winnerPopWheel">Wheel 1 · Names</div></div></div>
<main class="stage">
<section class="wheel-card"><h2 class="heading">WHEEL <span>1</span> · NAMES</h2><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel1" width="900" height="900"></canvas></div><div class="winner" id="winner1">Ready!</div></section>
<section class="wheel-card"><h2 class="heading">WHEEL <span>2</span> · GAMES</h2><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel2" width="900" height="900"></canvas></div><div class="winner" id="winner2">Ready!</div></section>
</main>
<div id="status">Connecting to SlotBuddy…</div>
<script>
(()=>{const layer=document.getElementById("fallLeaves");if(!layer)return;const leaves=["🍂","🍁","🍃","🍂","🍁","🍂","🍃","🍁"];for(let i=0;i<48;i++){const leaf=document.createElement("span");leaf.className="fall-leaf";leaf.textContent=leaves[i%leaves.length];leaf.style.setProperty("--x",((i*47)%104-2)+"vw");leaf.style.setProperty("--size",(22+(i*13)%27)+"px");leaf.style.setProperty("--duration",(10+(i*7)%13)+"s");leaf.style.setProperty("--delay",(-((i*5)%22))+"s");leaf.style.setProperty("--drift1",(((i*37)%220)-110)+"px");leaf.style.setProperty("--drift2",(((i*61)%300)-150)+"px");leaf.style.setProperty("--drift3",(((i*29)%260)-130)+"px");leaf.style.setProperty("--drift4",(((i*53)%340)-170)+"px");leaf.style.setProperty("--drift5",(((i*43)%220)-110)+"px");layer.appendChild(leaf)}})();
const API="https://xbogfbyysrjttyfvzluh.supabase.co/functions/v1/slotbuddy-name-wheels";
const state={1:{items:[],rotation:0,spinId:null,animating:false},2:{items:[],rotation:0,spinId:null,animating:false}};
const $=id=>document.getElementById(id);
function wheelColor(i,n,id){const t=n<=1?0:i/(n-1),start=id===1?[255,57,185]:[101,223,255],end=id===1?[101,223,255]:[255,57,185],rgb=start.map((v,k)=>Math.round(v+(end[k]-v)*t));return "rgb("+rgb.join(",")+")";}
let shimmerPhase=0,lastShimmerFrame=0;
function draw(id){const s=state[id],c=$("wheel"+id),ctx=c.getContext("2d"),items=s.items,n=Math.max(items.length,1),slice=Math.PI*2/n;ctx.clearRect(0,0,900,900);ctx.save();ctx.translate(450,450);ctx.rotate(s.rotation);for(let i=0;i<n;i++){const start=-Math.PI/2+i*slice;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,420,start,start+slice);ctx.closePath();ctx.fillStyle=items.length?wheelColor(i,n,id):"#34466f";ctx.fill();ctx.lineWidth=8;ctx.strokeStyle="#000";ctx.lineJoin="round";ctx.stroke();if(items.length){ctx.save();ctx.rotate(start+slice/2);ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillStyle="#101126";ctx.font="bold "+Math.max(22,Math.min(42,430/n))+"px system-ui";let name=items[i];if(name.length>26)name=name.slice(0,24)+"…";ctx.fillText(name,385,0,310);ctx.restore();}}ctx.save();ctx.beginPath();ctx.arc(0,0,414,0,Math.PI*2);ctx.clip();for(let k=0;k<34;k++){const angle=k*2.399963229728653+(id===1?.35:1.1),radius=105+((k*83)%285),x=Math.cos(angle)*radius,y=Math.sin(angle)*radius,twinkle=.22+.78*(.5+.5*Math.sin(shimmerPhase*.012+k*2.17)),size=2.2+(k%5===0?3.8:1.8)*twinkle;ctx.save();ctx.globalAlpha=twinkle;ctx.shadowColor=k%2===0?"#fff":"#65dfff";ctx.shadowBlur=8+size*2;ctx.strokeStyle=k%3===0?"#ffefff":"#ffffff";ctx.fillStyle="#ffffff";ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(x-size*2.2,y);ctx.lineTo(x+size*2.2,y);ctx.moveTo(x,y-size*2.2);ctx.lineTo(x,y+size*2.2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,Math.max(1.2,size*.42),0,Math.PI*2);ctx.fill();if(k%5===0){ctx.globalAlpha=twinkle*.75;ctx.beginPath();ctx.moveTo(x,y-size*2.8);ctx.lineTo(x+size*.65,y);ctx.lineTo(x,y+size*2.8);ctx.lineTo(x-size*.65,y);ctx.closePath();ctx.fill();}ctx.restore();}ctx.restore();ctx.beginPath();ctx.arc(0,0,62,0,Math.PI*2);ctx.fillStyle="#101126";ctx.fill();ctx.lineWidth=8;ctx.strokeStyle="#000";ctx.stroke();ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold 26px system-ui";ctx.fillText("SPIN",0,0);ctx.restore();}
let winnerPopTimer=null;
function hideWinnerPopup(){const popup=$("winnerPop");popup.classList.remove("show");popup.hidden=true;if(winnerPopTimer){clearTimeout(winnerPopTimer);winnerPopTimer=null;}}
function displayWinnerPopup(title,name,subtitle){const popup=$("winnerPop");if(winnerPopTimer){clearTimeout(winnerPopTimer);winnerPopTimer=null;}popup.hidden=false;popup.querySelector(".winner-pop-title").textContent=title;$("winnerPopName").textContent=name;$("winnerPopWheel").textContent=subtitle;popup.classList.add("show");winnerPopTimer=setTimeout(()=>{hideWinnerPopup();},10000)}
function showWinnerPopup(id,name){displayWinnerPopup("🎉 WINNER! 🎉",name,"Wheel "+id+" · "+(id===1?"Names":"Games"))}
let spinBatch={id:0,startedAt:0,firstWheel:null,paired:false,results:{}};
let singleWinnerTimer=null;
function noteNewSpin(id){const now=Date.now();if(!spinBatch.startedAt||now-spinBatch.startedAt>7000){spinBatch={id:spinBatch.id+1,startedAt:now,firstWheel:id,paired:false,results:{}};}else if(spinBatch.firstWheel!==id){spinBatch.paired=true;if(singleWinnerTimer){clearTimeout(singleWinnerTimer);singleWinnerTimer=null;}if(spinBatch.results[1]&&spinBatch.results[2])showPairWinnerPopup();}return spinBatch.id}
function showPairWinnerPopup(){displayWinnerPopup("🎉 WINNING PAIR! 🎉",spinBatch.results[1]+"\n🎮 "+spinBatch.results[2],"WHEEL 1 NAME  +  WHEEL 2 GAME")}
function recordSpinWinner(batchId,id,name){if(batchId!==spinBatch.id){showWinnerPopup(id,name);return;}spinBatch.results[id]=name;if(spinBatch.paired){if(spinBatch.results[1]&&spinBatch.results[2])showPairWinnerPopup();}else{if(singleWinnerTimer)clearTimeout(singleWinnerTimer);singleWinnerTimer=setTimeout(()=>{if(batchId===spinBatch.id&&!spinBatch.paired)showWinnerPopup(id,name);singleWinnerTimer=null;},2500)}}
function animate(id,spin){const s=state[id];if(!s.items.length||!spin.winner)return;const batchId=spinBatch.id;const target=((Number(spin.target_rotation)%(Math.PI*2))+Math.PI*2)%(Math.PI*2),start=s.rotation%(Math.PI*2),delta=(target-start+Math.PI*2)%(Math.PI*2)+Math.PI*2*7,begin=performance.now(),duration=5600;s.animating=true;function frame(now){const t=Math.min(1,(now-begin)/duration),ease=1-Math.pow(1-t,5);s.rotation=start+delta*ease;draw(id);if(t<1)requestAnimationFrame(frame);else{s.rotation=target;draw(id);s.animating=false;$("winner"+id).textContent="🎉 "+spin.winner+" 🎉";recordSpinWinner(batchId,id,spin.winner);}}requestAnimationFrame(frame);}
async function refresh(){try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"widget-snapshot"})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Unable to load wheels");for(const w of d.wheels||[]){const id=Number(w.wheel_id),s=state[id];if(!s)continue;const next=Array.isArray(w.entries)?w.entries:[];if(JSON.stringify(next)!==JSON.stringify(s.items)){s.items=next;if(!s.animating)draw(id);}}for(const spin of d.spins||[]){const id=Number(spin.wheel_id),s=state[id];if(!s)continue;if(s.spinId===null){s.spinId=spin.spin_id;draw(id);}else if(s.spinId!==spin.spin_id){s.spinId=spin.spin_id;noteNewSpin(id);animate(id,spin);}}$("status").textContent="LIVE · "+new Date().toLocaleTimeString();}catch(e){$("status").textContent="Waiting for wheel data…";}}
draw(1);draw(2);
function shimmerFrame(now){if(now-lastShimmerFrame>=40){lastShimmerFrame=now;shimmerPhase=(shimmerPhase+34)%1680;draw(1);draw(2);}requestAnimationFrame(shimmerFrame)}requestAnimationFrame(shimmerFrame);refresh();setInterval(refresh,900);
</script>
</body>
</html>
